<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meus Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0f;
  --surface: #17171a;
  --surface2: #1f1f24;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0efe8;
  --muted: #8a8a94;
  --accent: #c8f060;
  --accent-dim: rgba(200,240,96,0.12);
  --accent-text: #1a2800;
  --red: #ff6b6b;
  --red-dim: rgba(255,107,107,0.12);
  --blue: #6eb5ff;
  --blue-dim: rgba(110,181,255,0.1);
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  padding-bottom: 90px;
}

/* Header */
.header {
  padding: 52px 20px 20px;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid var(--border);
}
.header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
}
.header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 28px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.1;
}
.header h1 em {
  font-style: italic;
  color: var(--accent);
}
.month-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  user-select: none;
}
.month-chip button {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 0 2px;
  transition: color 0.15s;
}
.month-chip button:hover { color: var(--text); }
.month-chip span { min-width: 90px; text-align: center; }

/* Summary cards */
.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 20px;
}
.scard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.scard.accent {
  background: var(--accent);
  border-color: transparent;
}
.scard.accent .sl { color: rgba(0,0,0,0.5); }
.scard.accent .sv { color: #0d1a00; }
.scard::before {
  content: '';
  position: absolute;
  top: -20px; right: -20px;
  width: 60px; height: 60px;
  border-radius: 50%;
  background: rgba(255,255,255,0.03);
}
.sl { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.sv { font-size: 21px; font-weight: 600; color: var(--text); }
.sv.danger { color: var(--red); }

/* Tab bar */
.tabbar {
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--border);
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  z-index: 100;
  padding: 8px 0 20px;
}
.tabbar button {
  flex: 1;
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 0;
  color: var(--muted);
  font-size: 10px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  transition: color 0.2s;
}
.tabbar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.tabbar button.active { color: var(--accent); }

/* Content */
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Upload zone */
.upload-section { padding: 0 20px 20px; }
.upload-zone {
  border: 1.5px dashed var(--border2);
  border-radius: var(--radius);
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  background: var(--surface);
  transition: border-color 0.2s, background 0.2s;
  position: relative;
  overflow: hidden;
}
.upload-zone:hover, .upload-zone:active {
  border-color: var(--accent);
  background: var(--accent-dim);
}
.upload-zone .uz-icon {
  width: 52px; height: 52px;
  background: var(--accent-dim);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px;
}
.upload-zone .uz-icon svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 1.6; }
.upload-zone p { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.upload-zone span { font-size: 12px; color: var(--muted); }
#file-input { display: none; }

/* Preview */
.preview-wrap { margin-top: 16px; display: none; }
.preview-wrap img {
  width: 100%; border-radius: var(--radius);
  max-height: 200px; object-fit: cover;
  border: 1px solid var(--border);
}
.scan-btn {
  width: 100%; margin-top: 12px;
  background: var(--accent);
  color: var(--accent-text);
  border: none; border-radius: var(--radius-sm);
  padding: 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.scan-btn:hover { opacity: 0.9; }
.scan-btn:active { transform: scale(0.98); }
.scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.scan-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

/* Loading */
.loading-wrap { margin-top: 12px; display: none; }
.loading-text { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 8px; }
.progress-bar {
  height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent); width: 0%;
  transition: width 2.5s ease; border-radius: 2px;
}
.error-msg { font-size: 12px; color: var(--red); text-align: center; margin-top: 10px; display: none; padding: 10px; background: var(--red-dim); border-radius: var(--radius-sm); }

/* Result card */
.result-wrap { margin-top: 16px; display: none; }
.receipt-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.receipt-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.receipt-header .store-icon {
  width: 36px; height: 36px;
  background: var(--accent-dim);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Serif Display', serif;
  font-size: 16px; color: var(--accent);
}
.receipt-header .store-name { font-size: 14px; font-weight: 600; flex: 1; }
.receipt-header .store-total { font-size: 16px; font-weight: 600; color: var(--accent); }
.receipt-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
.receipt-item:last-child { border-bottom: none; }
.ri-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ri-name { font-size: 13px; flex: 1; color: var(--text); }
.ri-cat {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 3px 7px; border-radius: 999px;
  background: var(--surface2); color: var(--muted);
}
.ri-val { font-size: 13px; font-weight: 600; color: var(--text); min-width: 60px; text-align: right; }
.result-actions { display: flex; gap: 8px; margin-top: 10px; }
.result-actions button {
  flex: 1; padding: 12px; border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  border: 1px solid var(--border2);
  background: var(--surface2); color: var(--muted);
}
.result-actions button.save-btn {
  background: var(--accent); color: var(--accent-text); border-color: transparent;
}
.result-actions button:active { transform: scale(0.97); }

/* Section label */
.sec-label {
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.07em;
  padding: 0 20px 12px;
}

/* Expense list */
.list-section { padding: 20px 20px 0; }
.expense-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.expense-item:last-child { border-bottom: none; }
.exp-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.exp-info { flex: 1; min-width: 0; }
.exp-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exp-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
.exp-val { font-size: 15px; font-weight: 600; }
.exp-del {
  background: none; border: none; cursor: pointer;
  color: var(--muted); padding: 6px; border-radius: 6px;
  transition: color 0.15s, background 0.15s;
}
.exp-del:hover { color: var(--red); background: var(--red-dim); }
.exp-del svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.empty-state {
  text-align: center; padding: 48px 20px;
  color: var(--muted); font-size: 14px;
}
.empty-state .es-icon {
  font-size: 36px; margin-bottom: 12px;
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--surface); display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px;
}
.empty-state .es-icon svg { width: 28px; height: 28px; stroke: var(--muted); fill: none; stroke-width: 1.4; }

/* Chart */
.chart-section { padding: 0 20px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-label { font-size: 12px; color: var(--muted); width: 80px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.16,1,0.3,1); }
.bar-val { font-size: 11px; color: var(--muted); width: 64px; text-align: right; flex-shrink: 0; }

/* Manual form */
.form-section { padding: 0 20px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.field input, .field select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; color: var(--text);
  outline: none; transition: border-color 0.15s;
  -webkit-appearance: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field select option { background: #1f1f24; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.add-btn {
  width: 100%; padding: 14px;
  background: var(--accent); color: var(--accent-text);
  border: none; border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; margin-top: 4px;
  transition: opacity 0.15s, transform 0.1s;
}
.add-btn:hover { opacity: 0.9; }
.add-btn:active { transform: scale(0.98); }

/* Divider */
.divider { height: 1px; background: var(--border); margin: 0 20px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>Meus <em>gastos</em></h1>
    <div class="month-chip">
      <button id="prev-m" aria-label="Mês anterior">‹</button>
      <span id="month-lbl">Mai 2025</span>
      <button id="next-m" aria-label="Próximo mês">›</button>
    </div>
  </div>
  <div class="summary" style="padding: 0; margin: 0;">
    <div class="scard accent">
      <div class="sl">Total gasto</div>
      <div class="sv" id="s-total">R$ 0,00</div>
    </div>
    <div class="scard">
      <div class="sl">Lançamentos</div>
      <div class="sv" id="s-count">0</div>
    </div>
  </div>
</div>

<!-- TAB: RECIBO -->
<div class="tab-content active" id="tab-recibo">
  <div style="height: 20px;"></div>
  <div class="upload-section">
    <div class="sec-label">Foto do recibo</div>
    <div class="upload-zone" onclick="document.getElementById('file-input').click()">
      <div class="uz-icon">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
      <p>Fotografar ou escolher recibo</p>
      <span>jpg, png — tire foto diretamente</span>
    </div>
    <input type="file" id="file-input" accept="image/*" capture="environment">

    <div class="preview-wrap" id="preview-wrap">
      <img id="preview-img" alt="Recibo">
      <div class="error-msg" id="error-msg"></div>
      <div class="loading-wrap" id="loading-wrap">
        <div class="loading-text" id="loading-text">Lendo recibo com IA...</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <div class="result-wrap" id="result-wrap"></div>
      <button class="scan-btn" id="scan-btn" onclick="scanReceipt()">
        <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
        Analisar com IA
      </button>
    </div>
  </div>
</div>

<!-- TAB: GASTOS -->
<div class="tab-content" id="tab-gastos">
  <div style="height: 20px;"></div>
  <div class="list-section">
    <div class="sec-label">Lançamentos do mês</div>
    <div id="expense-list"></div>
  </div>
</div>

<!-- TAB: GRÁFICO -->
<div class="tab-content" id="tab-grafico">
  <div style="height: 20px;"></div>
  <div class="chart-section">
    <div class="sec-label">Por categoria</div>
    <div id="chart-bars"></div>
  </div>
</div>

<!-- TAB: MANUAL -->
<div class="tab-content" id="tab-manual">
  <div style="height: 20px;"></div>
  <div class="form-section">
    <div class="sec-label">Adicionar manualmente</div>
    <div class="field">
      <label>Descrição</label>
      <input type="text" id="m-desc" placeholder="Ex: Almoço, Uber, Farmácia...">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Valor (R$)</label>
        <input type="number" id="m-val" placeholder="0,00" min="0.01" step="0.01" inputmode="decimal">
      </div>
      <div class="field">
        <label>Categoria</label>
        <select id="m-cat"></select>
      </div>
    </div>
    <div class="field">
      <label>Data</label>
      <input type="date" id="m-date">
    </div>
    <button class="add-btn" onclick="addManual()">Adicionar gasto</button>
  </div>
</div>

<!-- Bottom tab bar -->
<nav class="tabbar">
  <button class="active" data-tab="recibo" onclick="switchTab('recibo', this)">
    <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    Recibo
  </button>
  <button data-tab="gastos" onclick="switchTab('gastos', this)">
    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Gastos
  </button>
  <button data-tab="grafico" onclick="switchTab('grafico', this)">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Gráfico
  </button>
  <button data-tab="manual" onclick="switchTab('manual', this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Manual
  </button>
</nav>

<script>
const CATS = [
  {name:"Alimentação", color:"#c8f060", emoji:"🍽️"},
  {name:"Mercado",     color:"#6eb5ff", emoji:"🛒"},
  {name:"Transporte",  color:"#a78bfa", emoji:"🚗"},
  {name:"Moradia",     color:"#fb923c", emoji:"🏠"},
  {name:"Saúde",       color:"#34d399", emoji:"💊"},
  {name:"Lazer",       color:"#f472b6", emoji:"🎉"},
  {name:"Educação",    color:"#fbbf24", emoji:"📚"},
  {name:"Vestuário",   color:"#22d3ee", emoji:"👕"},
  {name:"Serviços",    color:"#a3a3a3", emoji:"⚙️"},
  {name:"Outros",      color:"#6b7280", emoji:"📦"}
];
const MONTHS = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const now = new Date();
let cy = now.getFullYear(), cm = now.getMonth();

const fmt = v => "R$ " + Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const key = (y,m) => `exp_${y}_${m}`;
const load = (y,m) => { try { return JSON.parse(localStorage.getItem(key(y,m)) || "[]"); } catch { return []; }};
const save = (y,m,a) => { try { localStorage.setItem(key(y,m), JSON.stringify(a)); } catch {} };
const catOf = name => CATS.find(c => c.name === name) || CATS[9];

function render() {
  document.getElementById("month-lbl").textContent = MONTHS[cm] + " " + cy;
  const data = load(cy, cm);
  const total = data.reduce((s,e) => s + Number(e.valor), 0);
  document.getElementById("s-total").textContent = fmt(total);
  document.getElementById("s-count").textContent = data.length;
  renderList(data);
  renderChart(data);
}

function renderList(data) {
  const el = document.getElementById("expense-list");
  if (!data.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="es-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div>
      <div>Nenhum gasto este mês</div>
      <div style="font-size:12px;margin-top:4px;color:var(--muted)">Fotografe um recibo ou adicione manualmente</div>
    </div>`;
    return;
  }
  const sorted = [...data].sort((a,b) => new Date(b.data) - new Date(a.data));
  el.innerHTML = sorted.map(e => {
    const cat = catOf(e.cat);
    const d = e.data ? new Date(e.data + "T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}) : "";
    return `<div class="expense-item">
      <div class="exp-icon" style="background:${cat.color}22">${cat.emoji}</div>
      <div class="exp-info">
        <div class="exp-name">${e.desc}</div>
        <div class="exp-meta">${cat.name}${d ? " · " + d : ""}</div>
      </div>
      <div class="exp-val">${fmt(e.valor)}</div>
      <button class="exp-del" onclick="del('${e.id}')" aria-label="Remover">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
    </div>`;
  }).join("");
}

function renderChart(data) {
  const el = document.getElementById("chart-bars");
  const totals = {};
  CATS.forEach(c => totals[c.name] = 0);
  data.forEach(e => { totals[e.cat] = (totals[e.cat] || 0) + Number(e.valor); });
  const rows = CATS.filter(c => totals[c.name] > 0).sort((a,b) => totals[b.name] - totals[a.name]);
  if (!rows.length) { el.innerHTML = '<div class="empty-state" style="padding:32px 0"><div style="color:var(--muted);font-size:13px">Nenhum dado ainda</div></div>'; return; }
  const max = Math.max(...rows.map(c => totals[c.name]), 1);
  el.innerHTML = rows.map(c => `<div class="bar-row">
    <div class="bar-label">${c.emoji} ${c.name}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.round(totals[c.name]/max*100)}%;background:${c.color}"></div></div>
    <div class="bar-val">${fmt(totals[c.name])}</div>
  </div>`).join("");
}

function del(id) {
  if (!confirm("Remover este gasto?")) return;
  const arr = load(cy, cm).filter(e => e.id !== id);
  save(cy, cm, arr);
  render();
}

function addManual() {
  const desc = document.getElementById("m-desc").value.trim();
  const val = parseFloat(document.getElementById("m-val").value);
  const cat = document.getElementById("m-cat").value;
  const date = document.getElementById("m-date").value;
  if (!desc) { alert("Informe uma descrição"); return; }
  if (!val || val <= 0) { alert("Informe um valor válido"); return; }
  const arr = load(cy, cm);
  arr.push({id: Date.now().toString(), desc, valor: val, cat, data: date || new Date().toISOString().split("T")[0]});
  save(cy, cm, arr);
  document.getElementById("m-desc").value = "";
  document.getElementById("m-val").value = "";
  render();
  switchTab("gastos", document.querySelector('[data-tab="gastos"]'));
}

let b64 = null;
document.getElementById("file-input").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    b64 = e.target.result.split(",")[1];
    document.getElementById("preview-img").src = e.target.result;
    document.getElementById("preview-wrap").style.display = "block";
    document.getElementById("result-wrap").style.display = "none";
    document.getElementById("error-msg").style.display = "none";
    document.getElementById("loading-wrap").style.display = "none";
    document.getElementById("scan-btn").style.display = "flex";
    document.getElementById("scan-btn").disabled = false;
    document.getElementById("scan-btn").innerHTML = `<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg> Analisar com IA`;
  };
  reader.readAsDataURL(file);
});

async function scanReceipt() {
  if (!b64) { alert("Selecione uma imagem primeiro"); return; }
  const btn = document.getElementById("scan-btn");
  btn.disabled = true;
  btn.innerHTML = "Analisando...";
  document.getElementById("loading-wrap").style.display = "block";
  document.getElementById("error-msg").style.display = "none";
  document.getElementById("result-wrap").style.display = "none";
  const fill = document.getElementById("progress-fill");
  fill.style.width = "0%";
  setTimeout(() => fill.style.width = "65%", 100);

  const catList = CATS.map(c => c.name).join(", ");
  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            {type:"image", source:{type:"base64", media_type:"image/jpeg", data:b64}},
            {type:"text", text:`Analise este recibo/nota fiscal brasileiro e retorne APENAS JSON válido, sem texto extra, sem markdown.
Formato:
{"loja":"nome","data":"YYYY-MM-DD ou null","total":0.00,"itens":[{"nome":"item","valor":0.00,"categoria":"cat"}]}
Categorias disponíveis: ${catList}
Se não encontrar itens individuais, crie um item com o total. Retorne apenas o JSON.`}
          ]
        }]
      })
    });
    fill.style.width = "95%";
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error?.message || "Erro na API");
    const raw = data.content.find(b => b.type === "text")?.text || "";
    const clean = raw.replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(clean);
    fill.style.width = "100%";
    setTimeout(() => document.getElementById("loading-wrap").style.display = "none", 400);
    showResult(parsed);
  } catch(err) {
    document.getElementById("loading-wrap").style.display = "none";
    document.getElementById("error-msg").style.display = "block";
    document.getElementById("error-msg").textContent = "Não consegui ler o recibo. Tente uma foto mais nítida. (" + err.message + ")";
    btn.disabled = false;
    btn.innerHTML = "Tentar novamente";
  }
}

function showResult(parsed) {
  const el = document.getElementById("result-wrap");
  const itens = parsed.itens || [];
  const total = parsed.total || itens.reduce((s,i) => s + Number(i.valor), 0);
  const initial = (parsed.loja || "R").charAt(0).toUpperCase();
  el.style.display = "block";
  document.getElementById("scan-btn").style.display = "none";
  el.innerHTML = `<div class="receipt-card">
    <div class="receipt-header">
      <div class="store-icon">${initial}</div>
      <div class="store-name">${parsed.loja || "Recibo"}</div>
      <div class="store-total">${fmt(total)}</div>
    </div>
    ${itens.map(item => {
      const cat = catOf(item.categoria);
      return `<div class="receipt-item">
        <div class="ri-dot" style="background:${cat.color}"></div>
        <div class="ri-name">${item.nome}</div>
        <div class="ri-cat">${item.categoria}</div>
        <div class="ri-val">${fmt(item.valor)}</div>
      </div>`;
    }).join("")}
  </div>
  <div class="result-actions">
    <button onclick="discardResult()">Descartar</button>
    <button class="save-btn" onclick='confirmResult(${JSON.stringify(parsed).replace(/'/g,"&#39;")})'>Salvar tudo ✓</button>
  </div>`;
}

function discardResult() {
  document.getElementById("result-wrap").style.display = "none";
  document.getElementById("scan-btn").style.display = "flex";
  document.getElementById("scan-btn").disabled = false;
  document.getElementById("scan-btn").innerHTML = `<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg> Analisar com IA`;
}

function confirmResult(parsed) {
  const itens = parsed.itens || [];
  const date = parsed.data || new Date().toISOString().split("T")[0];
  const loja = parsed.loja || "Recibo";
  const arr = load(cy, cm);
  if (itens.length === 0) {
    arr.push({id: Date.now().toString(), desc: loja, valor: parsed.total || 0, cat: "Outros", data: date});
  } else {
    itens.forEach((item, i) => {
      arr.push({id: (Date.now() + i).toString(), desc: item.nome, valor: Number(item.valor), cat: item.categoria || "Outros", data: date});
    });
  }
  save(cy, cm, arr);
  render();
  document.getElementById("preview-wrap").style.display = "none";
  document.getElementById("result-wrap").style.display = "none";
  document.getElementById("file-input").value = "";
  b64 = null;
  switchTab("gastos", document.querySelector('[data-tab="gastos"]'));
}

function switchTab(tab, el) {
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tabbar button").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
  if (el) el.classList.add("active");
}

// Init
const sel = document.getElementById("m-cat");
CATS.forEach(c => { const o = document.createElement("option"); o.value = c.name; o.textContent = c.emoji + " " + c.name; sel.appendChild(o); });
document.getElementById("m-date").value = new Date().toISOString().split("T")[0];
document.getElementById("prev-m").addEventListener("click", () => { cm--; if(cm<0){cm=11;cy--;} render(); });
document.getElementById("next-m").addEventListener("click", () => { cm++; if(cm>11){cm=0;cy++;} render(); });
render();
</script>
